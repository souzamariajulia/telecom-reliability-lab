name: Telecom Reliability Lab - CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Testes da Telecom API
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r telecom-api/requirements.txt
          pip install pytest

      - name: Executar testes
        run: |
          python -m pytest telecom-api/tests/ -v


docker-build:
    name: Build das imagens Docker
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Build Telecom API
        run: docker build -t telecom-api:ci ./telecom-api

      - name: Build Network Service
        run: docker build -t telecom-network-service:ci ./network-service