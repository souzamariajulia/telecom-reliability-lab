services:
  telecom-api:
    build: ./telecom-api
    container_name: telecom-api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      NETWORK_URL: http://network-service:8001
    depends_on:
      - network-service
    networks:
      - telecom-network

  network-service:
    build: ./network-service
    container_name: network-service
    networks:
      - telecom-network

  prometheus:
    image: prom/prometheus:latest
    container_name: telecom-prometheus
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - telecom-prometheus-data:/prometheus
    networks:
      - telecom-network

volumes:
  telecom-prometheus-data:

networks:
  telecom-network:
    driver: bridge